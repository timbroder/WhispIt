name: WhispIt

options:
  bundleIdPrefix: com.whispit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.3"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.4"
  # Speech-engine bake-off (WhispIt-peu): the Parakeet TDT prototype. Linked
  # into WhispItIntegrationTests only: in the app it adds ~30 MB to Release
  # builds even when only DEBUG code uses it.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    minorVersion: "0.18.4"

settings:
  base:
    DEVELOPMENT_TEAM: LTU7433MF2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  WhispItApp:
    type: application
    platform: iOS
    sources:
      - path: WhispItApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispit.app
        PRODUCT_NAME: WhispIt
        INFOPLIST_FILE: WhispItApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhispItApp/WhispItApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: WhispItKeyboard
      - package: WhisperKit
        product: WhisperKit
    scheme:
      testTargets:
        - WhispItTests
        - WhispItKeyboardTests
        - WhispItIntegrationTests
        - WhispItUITests
      gatherCoverageData: true
      coverageTargets:
        - WhispItApp

  # Fast, hermetic unit tests (no model, no network). Run in CI.
  WhispItTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhispItTests
    dependencies:
      - target: WhispItApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispit.app.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app target is WhispItApp but its product is WhispIt.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhispIt.app/WhispIt"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Keyboard logic. Extensions can't host tests, so the keyboard's
  # non-UI sources and Shared/ are compiled straight into a hostless bundle.
  WhispItKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhispItKeyboardTests
      - path: Shared
      - path: WhispItKeyboard/KeyboardState.swift
      - path: WhispItKeyboard/KeyboardDictationController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispit.app.keyboardtests
        GENERATE_INFOPLIST_FILE: YES

  # Local-only tests that need a WhisperKit model download and Apple
  # Intelligence (Foundation Models). Excluded from CI.
  WhispItIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhispItIntegrationTests
    dependencies:
      - target: WhispItApp
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispit.app.integrationtests
        GENERATE_INFOPLIST_FILE: YES
        # The app target is WhispItApp but its product is WhispIt.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhispIt.app/WhispIt"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WhispItUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhispItUITests
    dependencies:
      - target: WhispItApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispit.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhispItApp

  WhispItKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: WhispItKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whispit.app.keyboard
        PRODUCT_NAME: WhispItKeyboard
        INFOPLIST_FILE: WhispItKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhispItKeyboard/WhispItKeyboard.entitlements
